<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>King_Ak – Profil</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: #ffffff;
    }

    .profile-card {
      max-width: 420px;
      margin: 60px auto;
      background: #181818;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .banner {
      height: 140px;
      background: linear-gradient(90deg, #ffcc00, #ff9500);
    }

    .avatar-wrapper {
      display: flex;
      justify-content: center;
      margin-top: -80px;
    }

    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #181818;
      background: #000;
      object-fit: cover;
    }

    .content {
      padding: 20px 30px 30px;
      text-align: center;
    }

    .name {
      font-size: 2rem;
      font-weight: 800;
      margin: 10px 0 5px;
    }

    .tag {
      color: #ffcc00;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .quote {
      background: #222;
      border-radius: 14px;
      padding: 16px;
      margin: 12px 0;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffcc00;
    }

    .stat-label {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .footer {
      margin-top: 25px;
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="banner"></div>

    <div class="avatar-wrapper">
      <img
        class="avatar"
        src="https://render.crafty.gg/3d/bust/b423ccf3-d2d7-4b5d-b734-8c30511f29fa"
        alt="King_Ak Avatar"
      />
    </div>

    <div class="content">
      <div class="name">King_Ak</div>
      <div class="tag">Weisheiten · Mindset · Chaos</div>

      <div class="quote">„Ich hab die Bälle … die Schleim-Bälle.“</div>
      <div class="quote">„Wir brauchen so nen Server, auf dem alle reinswetten.“</div>

      <div class="stats">
        <div class="stat">
          <div class="stat-number">∞</div>
          <div class="stat-label">Confidence</div>
        </div>
        <div class="stat">
          <div class="stat-number">100%</div>
          <div class="stat-label">Aura</div>
        </div>
        <div class="stat">
          <div class="stat-number">24/7</div>
          <div class="stat-label">Mindset</div>
        </div>
      </div>

      <div class="footer">Peak-Profil · King_Ak</div>
    </div>
  </div>
</body>
</html>
