<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>King_Ak – Live Profil</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: #ffffff;
    }

    .profile-card {
      max-width: 420px;
      margin: 60px auto;
      background: #181818;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .banner {
      height: 140px;
      background: linear-gradient(90deg, #ffcc00, #ff9500);
    }

    .avatar-wrapper {
      display: flex;
      justify-content: center;
      margin-top: -80px;
    }

    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #181818;
      background: #000;
      object-fit: cover;
    }

    .content {
      padding: 20px 30px 30px;
      text-align: center;
    }

    .name {
      font-size: 2rem;
      font-weight: 800;
      margin: 10px 0 5px;
    }

    .tag {
      color: #ffcc00;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .quote {
      background: #222;
      border-radius: 14px;
      padding: 16px;
      margin: 12px 0;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffcc00;
    }

    .stat-label {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .socials {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }

    .social {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      border-radius: 12px;
      background: #222;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="profile-card">
    <div class="banner"></div>

    <div class="avatar-wrapper">
      <img id="avatar" class="avatar" />
    </div>

    <div class="content">
      <div id="name" class="name">King_Ak</div>
      <div class="tag">Weisheiten · Mindset · Chaos</div>

      <!-- Deine Quotes bleiben -->
      <div class="quote">„Ich hab die Bälle … die Schleim-Bälle.“</div>
      <div class="quote">„We need a server where everybody swetts!“</div>
      <div class="quote">„Ich weiß nicht was du kochst, aber du kochst.“</div>

      <!-- Kombi aus Fun + echten Daten -->
      <div class="stats">
        <div class="stat">
          <div id="region" class="stat-number">∞</div>
          <div class="stat-label">Region</div>
        </div>
        <div class="stat">
          <div id="points" class="stat-number">1000%</div>
          <div class="stat-label">Points</div>
        </div>
        <div class="stat">
          <div id="overall" class="stat-number">24/7</div>
          <div class="stat-label">Overall</div>
        </div>
      </div>

      <!-- Live Rankings -->
      <div id="rankings" class="socials"></div>

      <!-- Deine Socials bleiben -->
      <div class="socials">
        <div class="social">Discord · ID: 1294612909288198144</div>
        <a class="social" href="https://www.youtube.com/@King.Ak_YT-Minecraft" target="_blank">YouTube · King_Ak</a>
        <a class="social" href="https://www.tiktok.com/@suibk3" target="_blank">TikTok · @suibk3</a>
      </div>
    </div>
  </div>

  <script>
    const API = "https://mctiers.com/api/v2";
    const USERNAME = "KingAK_YT";

    async function loadLiveData() {
      try {
        const res = await fetch(`${API}/profile/by-name/${USERNAME}`);
        const data = await res.json();

        document.getElementById("name").textContent = data.name;
        document.getElementById("region").textContent = data.region ?? "??";
        document.getElementById("points").textContent = data.points ?? 0;
        document.getElementById("overall").textContent = "#" + (data.overall ?? "–");

        document.getElementById("avatar").src =
          `https://render.crafty.gg/3d/bust/${data.uuid}`;

        const rankings = document.getElementById("rankings");
        rankings.innerHTML = "";

        Object.entries(data.rankings || {}).forEach(([mode, r]) => {
          const el = document.createElement("div");
          el.className = "social";
          el.textContent = `${mode.toUpperCase()} → Tier ${r.tier} ${r.pos === 0 ? "High" : "Low"}`;
          rankings.appendChild(el);
        });
      } catch {
        console.warn("MCTiers API nicht erreichbar");
      }
    }

    loadLiveData();
  </script>
</body>
</html>
